server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${NAVAN_DB_PATH:./data/navan.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      pool-name: navan-sqlite
      connection-init-sql: "PRAGMA foreign_keys = ON"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jooq:
    sql-dialect: SQLITE
  jackson:
    property-naming-strategy: SNAKE_CASE

logging:
  level:
    org.jooq: WARN
    org.springframework.jdbc: WARN
