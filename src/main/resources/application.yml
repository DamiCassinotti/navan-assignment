server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${NAVAN_DB_PATH:./data/navan.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      pool-name: navan-sqlite
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jooq:
    sql-dialect: SQLITE
  jackson:
    property-naming-strategy: SNAKE_CASE

logging:
  level:
    org.jooq: WARN
    org.springframework.jdbc: WARN
